# =============================================================================
# supervisor — process tree for the web container
#
# php-fpm and nginx always run here. The queue worker and scheduler are OFF by
# default because CPI has no queued jobs or scheduled tasks yet; set
# RUN_QUEUE_WORKER=true / RUN_SCHEDULER=true the day that changes.
# =============================================================================

[supervisord]
nodaemon=true
user=root
; Supervisor's own log goes to stderr so nothing is written to a file nobody
; will ever read inside the container.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

; ---------------------------------------------------------------------------
; php-fpm — starts first (priority), because nginx needs its socket to exist.
; -F keeps the master in the foreground so supervisor can supervise it.
; ---------------------------------------------------------------------------
[program:php-fpm]
command=php-fpm -F
priority=10
autostart=true
autorestart=true
startsecs=3
; Graceful drain: finish in-flight requests before the master exits.
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; nginx — the only process bound to :80.
; ---------------------------------------------------------------------------
[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=3
; QUIT = finish serving current connections, then exit.
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; queue worker — optional (RUN_QUEUE_WORKER)
; --max-time recycles the process hourly so long-lived memory growth and stale
; code are both bounded. TERM lets Laravel finish the current job first.
; ---------------------------------------------------------------------------
[program:queue]
command=php /var/www/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=/var/www
user=www-data
priority=30
autostart=%(ENV_RUN_QUEUE_WORKER)s
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; scheduler — optional (RUN_SCHEDULER)
; `schedule:work` is a long-running loop that ticks every minute. (`schedule:run`
; would exit immediately and be restarted in a tight loop by supervisor.)
; ---------------------------------------------------------------------------
[program:scheduler]
command=php /var/www/artisan schedule:work
directory=/var/www
user=www-data
priority=30
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
