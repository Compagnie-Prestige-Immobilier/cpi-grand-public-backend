# =============================================================================
# nginx — main configuration (CPI API)
#
# Runs in the foreground under supervisor. Everything logs to the container's
# stdout/stderr so `docker logs` is the single place to look.
# =============================================================================

# Workers must run as www-data: that is the owner of the php-fpm socket (0660)
# and of everything under /var/www.
user www-data;

# One worker per core; each is single-threaded and event-driven.
worker_processes auto;

# Workers hold two descriptors per connection (client + FastCGI socket), so the
# process limit must comfortably exceed worker_connections.
worker_rlimit_nofile 8192;

pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    # Ceiling per worker — generous for a short-request CRUD API.
    worker_connections 2048;

    # Accept as many new connections as are pending per event loop pass.
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Logging -------------------------------------------------------------
    # request_time / upstream_response_time separate "PHP was slow" from
    # "nginx was waiting" when diagnosing a slow endpoint.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /dev/stdout main buffer=32k flush=5s;

    # --- Transfer tuning -----------------------------------------------------
    sendfile on;          # kernel-space file copies for static assets
    tcp_nopush on;        # coalesce headers with the first data packet
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;    # don't advertise the nginx version

    keepalive_timeout 65;
    keepalive_requests 1000;

    # Slow-client protection. Generous enough for a 50 MB chantier video on a
    # weak connection, strict enough to shed idle sockets.
    client_body_timeout 120s;
    client_header_timeout 15s;
    send_timeout 60s;
    reset_timedout_connection on;

    # Must stay >= post_max_size in php.ini — chantier media are capped at
    # 50 MB in the app (validation max:51200), plus multipart overhead.
    client_max_body_size 60m;
    client_body_buffer_size 256k;

    # --- Static file cache ---------------------------------------------------
    # Metadata cache for public/ assets.
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # --- Compression ---------------------------------------------------------
    # JSON is the payload that matters here.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # --- Client IP behind the TLS terminator ---------------------------------
    # The container sits behind a reverse proxy, so REMOTE_ADDR would otherwise
    # be the proxy. Laravel's per-IP rate limiting (login) depends on this being
    # the real visitor.
    #
    # NARROW THIS to the proxy's address/CIDR in a hostile network — as written
    # it trusts X-Forwarded-For from any peer, which is only safe because the
    # container port is bound to 127.0.0.1 on the host.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
