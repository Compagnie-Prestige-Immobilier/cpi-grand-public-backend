# =============================================================================
# CPI API — server block
#
# TLS, HSTS and the public hostname belong to the reverse proxy in front of this
# container. Here we only speak plain HTTP on :80.
# =============================================================================

# php-fpm over a unix socket: no TCP/loopback overhead, and the socket cannot be
# reached from outside the container.
upstream php-fpm {
    server unix:/run/php/php-fpm.sock;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/public;
    index index.php;

    charset utf-8;

    # --- Response headers ----------------------------------------------------
    # `always` so they survive error responses too. HSTS is intentionally left to
    # the TLS terminator, which is the only layer that knows the scheme.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;          # API serves no embeddable UI
    add_header Referrer-Policy "no-referrer" always;
    fastcgi_hide_header X-Powered-By;

    # --- Health check --------------------------------------------------------
    # Hit every 30s by Docker; logging it would drown the access log.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # --- Static assets -------------------------------------------------------
    # Long cache for public/ assets. Falls through to PHP for anything missing,
    # since Laravel owns 404 rendering. (User uploads live on R2, never here.)
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Never serve dotfiles (.env, .git) even if one lands in public/ by mistake.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Front controller ----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP -----------------------------------------------------------------
    location ~ ^/index\.php(/|$) {
        include fastcgi_params;

        fastcgi_pass php-fpm;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Tell Laravel the original scheme so generated URLs (signed R2 links
        # excepted — those come from R2 itself) match the public origin.
        # Requires TRUSTED_PROXIES to be set in the app environment.
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;

        # Buffers sized for JSON API responses: most fit in the first buffer, so
        # nothing hits disk.
        fastcgi_buffering on;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_temp_file_write_size 64k;

        # Short-request API: nothing legitimate should exceed this. A 50 MB
        # upload's time is spent in client_body (nginx), not in PHP.
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # Any other .php path is an attack probe — Laravel has exactly one entry point.
    location ~ \.php$ {
        return 404;
    }
}
