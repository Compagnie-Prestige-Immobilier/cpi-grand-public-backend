; =============================================================================
; php-fpm pool — CPI API
; Loaded as php-fpm.d/zz-www.conf, overriding the image's default www pool.
; =============================================================================

[www]
user = www-data
group = www-data

; --- Socket ------------------------------------------------------------------
; Unix socket instead of 127.0.0.1:9000 — lower overhead, and unreachable from
; outside the container. nginx runs as www-data, hence the ownership.
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Queue of pending connections before nginx sees a 502.
listen.backlog = 1024

; --- Worker pool -------------------------------------------------------------
; `dynamic`: keep a warm floor of workers, grow under load, reap the excess.
;
; Short-request CRUD API: workers turn over quickly, so the pool rarely needs to
; grow. Values are interpolated from the environment, which is why the
; Dockerfile always sets them.
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}

; Recycle workers periodically so a slow leak in any dependency can't grow
; unbounded. Cheap because OPcache is shared, not per-worker.
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}

; --- Timeouts ----------------------------------------------------------------
; Hard kill for a request that exceeds this — unlike max_execution_time, it DOES
; count time waiting on sockets (Postgres, R2 uploads). Must stay >= nginx
; fastcgi_read_timeout (60s).
request_terminate_timeout = 90s

; Dump a PHP backtrace for anything slower than 5s. This is how you find out
; whether it was the query, the R2 round-trip or the serialisation that dragged.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

; --- Environment -------------------------------------------------------------
; CRITICAL: without this, php-fpm hides the container's environment from PHP and
; every env() lookup (DB credentials, R2 keys) comes back null.
clear_env = no

; --- Logging -----------------------------------------------------------------
; Worker stdout/stderr goes to the container log instead of being swallowed.
catch_workers_output = yes
decorate_workers_output = no

; nginx already logs every request; a second access log would just double it.
access.log = /dev/null

; --- Status ------------------------------------------------------------------
; Exposed only inside the container (nginx does not proxy it); read it with
; `docker exec <c> curl --unix-socket /run/php/php-fpm.sock http://localhost/fpm-status`
; when you need live worker counts.
pm.status_path = /fpm-status
ping.path = /fpm-ping
