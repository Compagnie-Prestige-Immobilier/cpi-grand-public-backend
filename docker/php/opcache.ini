; =============================================================================
; OPcache — the single largest throughput win for a PHP app
;
; Compiled bytecode is cached in shared memory, so Laravel's boot cost is paid
; once per worker lifetime instead of once per request.
; =============================================================================

opcache.enable = 1
opcache.enable_cli = 0

; Laravel + this app's dependencies are a few thousand files. 192 MB leaves
; plenty of room; check `opcache_get_status()` if you add large packages.
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; Code inside the image never changes at runtime, so skip the mtime check on
; every include. THIS IS WHY A DEPLOY MUST REPLACE THE CONTAINER, not just the
; files on a volume — edited files would be ignored until restart.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Docblocks must be preserved: spatie/laravel-data, Spatie Permission and the
; typescript-transformer attributes are read via reflection. Stripping comments
; breaks them in subtle ways.
opcache.save_comments = 1

; Let PHP resolve include paths itself; the override is slower and unnecessary.
opcache.enable_file_override = 0

; Recompile a file at most once per process even after a fatal error.
opcache.max_wasted_percentage = 10

; --- JIT ---------------------------------------------------------------------
; Tracing JIT. This app is I/O-bound (Postgres, Redis, R2), so expect a modest
; gain on serialisation rather than a dramatic one. If you ever suspect JIT in
; a crash, set opcache.jit=disable and restart — nothing else depends on it.
opcache.jit = tracing
opcache.jit_buffer_size = 64M
