; =============================================================================
; PHP — production settings (CPI API)
; Loaded as conf.d/zz-app.ini so it wins over the image defaults.
; =============================================================================

; --- Errors ------------------------------------------------------------------
; Never render errors into a response: an API leak here is a security issue.
; Everything goes to stderr, which Docker collects.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

; --- Limits ------------------------------------------------------------------
; Short-request CRUD API: 256M leaves ample headroom for the biggest multipart
; upload plus DTO serialisation. Workers are sized against this in www.conf.
memory_limit = 256M

; Wall-clock ceiling for a request. PHP does NOT count time spent waiting on
; sockets (Postgres, R2), so this bounds runaway CPU — fpm's
; request_terminate_timeout bounds total time.
max_execution_time = 60
max_input_time = 120
max_input_vars = 2000

; Chantier media are validated at 50 MB in the app (max:51200); leave headroom
; for multipart overhead. Must stay <= nginx client_max_body_size (60m).
upload_max_filesize = 52M
post_max_size = 60M
max_file_uploads = 20

; --- Output ------------------------------------------------------------------
; Standard buffered output — this API streams nothing.
output_buffering = 4096

; --- Filesystem --------------------------------------------------------------
; Laravel touches thousands of paths per request; caching stat() results is a
; measurable win. The TTL is irrelevant in an immutable image, but harmless.
realpath_cache_size = 8M
realpath_cache_ttl = 600

; --- Misc --------------------------------------------------------------------
expose_php = Off
date.timezone = UTC
